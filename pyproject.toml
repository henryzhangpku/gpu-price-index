[project]
name = "gpuidx"
version = "0.1.0"
description = "A reference implementation of a daily GPU rental price benchmark"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
gpuidx = "gpuidx.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuidx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
