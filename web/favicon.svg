<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GPU rental price benchmark">
  <!-- Three seller quotes at three heights: no two GPU providers quote alike. -->
  <style>
    .ground { fill: #0E7C86; }
    .bar    { fill: #F5F7F7; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #3FBECB; }
      .bar    { fill: #0A0E0F; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="7"/>
  <g class="bar">
    <rect x="6"    y="13" width="5" height="13" rx="2.5"/>
    <rect x="13.5" y="7"  width="5" height="19" rx="2.5"/>
    <rect x="21"   y="17" width="5" height="9"  rx="2.5"/>
  </g>
</svg>
